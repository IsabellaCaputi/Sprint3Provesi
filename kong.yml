_format_version: "2.1"

services:
  - host: monitoring_upstream
    name: monitoring_service
    protocol: http
    routes:
      
      - name: monitoring
        paths:
          - /
        strip_path: false

  - host: alarms_upstream
    name: alarms_service
    protocol: http
    routes:
      
      - name: alarms
        paths:
          - /alarms
          - /alarmsValidate/
        strip_path: false
    
upstreams:
  - name: alarms_upstream
    targets:
    healthchecks:
      threshold: 50
      active:
        http_path: /health/
        timeout: 0.3
        healthy:
          successes: 5
          interval: 1
        unhealthy:
          tcp_failures: 1
          interval: 3

  - name: monitoring_upstream
    targets:
      - target: 172.31.22.243:8080
        weight: 100
      - target: 172.31.17.76:8080
        weight: 100
      - target: 172.31.16.185:8080
        weight: 100

    healthchecks:
      threshold: 50
      active:
        http_path: /health/
        timeout: 0.3
        healthy:
          successes: 5
          interval: 1
        unhealthy:
          tcp_failures: 1
          interval: 3


